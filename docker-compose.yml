services:
  db:
    image: ankane/pgvector:latest
    container_name: rag_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: rag_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ragdb
      - DB_USER=postgres
      - DB_PASSWORD=Password
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3.2
      - EMBED_MODEL=nomic-embed-text
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: rag_frontend
    restart: always
    depends_on:
      - backend
    environment:
      # Streamlit runs in the user's browser, but Python requests run in the container.
      # The container needs to reach the backend service.
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata:
  hf_cache:
